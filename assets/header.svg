<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ef4444" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .name{font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f3f4f6;letter-spacing:1px}
    .role{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f87171;letter-spacing:3px}
    .meta{font:400 16px Consolas,'Courier New',monospace;fill:#9ca3af}
    .fade{opacity:0;animation:in 1s ease-out forwards}
    .d2{animation-delay:.4s}.d3{animation-delay:.8s}
    .scan{animation:scan 4s linear infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes scan{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#line)" class="scan"/>
  <rect x="0" y="258" width="1200" height="2" fill="url(#line)" class="scan"/>
  <text x="600" y="72" text-anchor="middle" class="meta fade">&lt;developer location="Jaffna, Sri Lanka" mode="remote" /&gt;</text>
  <text x="600" y="140" text-anchor="middle" class="name fade d2">Piratheep Rajaratnam</text>
  <text x="600" y="186" text-anchor="middle" class="role fade d3">FULL-STACK DEVELOPER · CO-FOUNDER &amp; CTO</text>
  <text x="600" y="222" text-anchor="middle" class="meta fade d3">PHP 8 · Laravel · React · Next.js · WordPress</text>
  <circle cx="60" cy="60" r="6" fill="#ef4444" class="pulse"/>
  <circle cx="1140" cy="200" r="6" fill="#ef4444" class="pulse"/>
</svg>
